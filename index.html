            }
          },
          {
            "@type": "Question",
            "name": "哪些支出要算進緊急預備金？",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "依 CFPB 指引，只計入失業期間「無法削減」的必要支出：房租/房貸、水電、伙食、保險、交通、醫療、扶養。可裁切的娛樂、訂閱、儲蓄不算。"
            }
          },

            "@type": "Question",
            "name": "存到緊急預備金後該放哪？",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "高流動性帳戶（活存、貨幣型基金、短期定存），不要投股票。可參考 4% 安全提領法則作為長期投資的提領上限參考。"
