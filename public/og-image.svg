<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#F2EBDC" stroke-width="0.5" opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0F0E0C"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Top tagline (Eyebrow) -->
  <g transform="translate(70, 80)">
    <text x="0" y="0" font-family="Georgia, serif" font-size="22" font-weight="600" fill="#D4A574">§</text>
    <text x="22" y="0" font-family="Menlo, ui-monospace, monospace" font-size="15" font-weight="500" fill="#8B8275" letter-spacing="2">EMERGENCY FUND CALCULATOR</text>
  </g>

  <!-- Main title (Chinese) -->
  <text x="70" y="290" font-family="'PingFang TC', 'Heiti TC', 'Songti TC', serif" font-size="78" font-weight="600" fill="#F2EBDC" letter-spacing="2">緊急預備金計算器</text>

  <!-- Subtitle -->
  <text x="70" y="345" font-family="'PingFang TC', 'Songti TC', serif" font-size="30" font-weight="400" fill="#8B8275" letter-spacing="1">試算你需要存幾個月生活費</text>

  <!-- URL footer -->
  <g transform="translate(70, 555)">
    <line x1="0" y1="-22" x2="40" y2="-22" stroke="#D4A574" stroke-width="2"/>
    <text x="0" y="0" font-family="Menlo, ui-monospace, monospace" font-size="20" font-weight="400" fill="#D4A574" letter-spacing="0.5">emergency-fund.chialin.me</text>
  </g>

  <!-- Right card -->
  <g transform="translate(720, 60)">
    <rect x="0" y="0" width="430" height="510" rx="12" fill="#1A1814" stroke="#2A2620" stroke-width="1"/>

    <!-- Pentagon radar (center 215, 170 within card → absolute 935, 230) -->
    <g transform="translate(215, 170)">
      <!-- Background pentagons (concentric grid) -->
      <polygon points="0,-100 95.11,-30.90 58.78,80.90 -58.78,80.90 -95.11,-30.90"
               fill="none" stroke="#3A352D" stroke-width="1" opacity="0.6"/>
      <polygon points="0,-67 63.72,-20.71 39.38,54.20 -39.38,54.20 -63.72,-20.71"
               fill="none" stroke="#3A352D" stroke-width="1" opacity="0.4"/>
      <polygon points="0,-33 31.39,-10.20 19.40,26.70 -19.40,26.70 -31.39,-10.20"
               fill="none" stroke="#3A352D" stroke-width="1" opacity="0.3"/>

      <!-- Axes -->
      <line x1="0" y1="0" x2="0" y2="-100" stroke="#3A352D" stroke-width="1" opacity="0.4"/>
      <line x1="0" y1="0" x2="95.11" y2="-30.90" stroke="#3A352D" stroke-width="1" opacity="0.4"/>
      <line x1="0" y1="0" x2="58.78" y2="80.90" stroke="#3A352D" stroke-width="1" opacity="0.4"/>
      <line x1="0" y1="0" x2="-58.78" y2="80.90" stroke="#3A352D" stroke-width="1" opacity="0.4"/>
      <line x1="0" y1="0" x2="-95.11" y2="-30.90" stroke="#3A352D" stroke-width="1" opacity="0.4"/>

      <!-- Data polygon -->
      <polygon points="0,-70 52.31,-16.99 49.96,68.76 -41.14,56.63 -57.07,-18.54"
               fill="#D4A574" fill-opacity="0.18" stroke="#D4A574" stroke-width="1.5"/>

      <!-- Vertex dots -->
      <circle cx="0" cy="-70" r="3" fill="#D4A574"/>
      <circle cx="52.31" cy="-16.99" r="3" fill="#D4A574"/>
      <circle cx="49.96" cy="68.76" r="3" fill="#D4A574"/>
      <circle cx="-41.14" cy="56.63" r="3" fill="#D4A574"/>
      <circle cx="-57.07" cy="-18.54" r="3" fill="#D4A574"/>

      <!-- Vertex labels -->
      <text x="0" y="-115" font-family="'PingFang TC', sans-serif" font-size="15" fill="#A89B8A" text-anchor="middle">扶養人</text>
      <text x="113" y="-32" font-family="'PingFang TC', sans-serif" font-size="15" fill="#A89B8A" text-anchor="start">收入</text>
      <text x="73" y="100" font-family="'PingFang TC', sans-serif" font-size="15" fill="#A89B8A" text-anchor="start">健康</text>
      <text x="-73" y="100" font-family="'PingFang TC', sans-serif" font-size="15" fill="#A89B8A" text-anchor="end">產業</text>
      <text x="-113" y="-32" font-family="'PingFang TC', sans-serif" font-size="15" fill="#A89B8A" text-anchor="end">負債</text>
    </g>

    <!-- Divider -->
    <line x1="40" y1="340" x2="390" y2="340" stroke="#2A2620" stroke-width="1"/>

    <!-- Result section label -->
    <text x="215" y="370" font-family="'PingFang TC', sans-serif" font-size="13" fill="#8B8275" text-anchor="middle" letter-spacing="3">建議備足月數</text>

    <!-- Big number "6 個月" -->
    <text x="215" y="438" font-family="Georgia, 'Songti TC', serif" font-size="76" font-weight="600" fill="#D4A574" text-anchor="middle">6<tspan font-family="'PingFang TC', 'Songti TC', serif" font-size="32" font-weight="400" fill="#F2EBDC" dx="10">個月</tspan></text>

    <!-- Progress bar (3 segments) -->
    <g transform="translate(55, 466)">
      <!-- Segment 1 (filled) -->
      <rect x="0" y="0" width="100" height="8" rx="4" fill="#D4A574"/>
      <!-- Segment 2 (filled - current) -->
      <rect x="110" y="0" width="100" height="8" rx="4" fill="#D4A574"/>
      <!-- Segment 3 (empty) -->
      <rect x="220" y="0" width="100" height="8" rx="4" fill="#2A2620"/>

      <!-- Segment labels -->
      <text x="50" y="32" font-family="Menlo, monospace" font-size="13" fill="#8B8275" text-anchor="middle">3</text>
      <text x="160" y="32" font-family="Menlo, monospace" font-size="13" fill="#D4A574" text-anchor="middle" font-weight="600">6</text>
      <text x="270" y="32" font-family="Menlo, monospace" font-size="13" fill="#5A5347" text-anchor="middle">9</text>
    </g>
  </g>
</svg>
